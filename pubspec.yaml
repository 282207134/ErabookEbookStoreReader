name: erabook
description: "Erabook - Ebook Store & Reader app built from the Pixso UI Kit."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/welcome_bookshelf.png
    - assets/andrew.png
    - assets/empty_notifications.png
    - assets/covers/
    - assets/genres/
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist.ttf
